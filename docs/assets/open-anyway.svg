<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"
     aria-label="System Settings, Privacy and Security: the row reading 9film.app was blocked to protect your Mac, with the Open Anyway button beside it.">
  <title>Where the Open Anyway button lives</title>

  <!-- Presentation attributes rather than a <style> block: the file is served as
       an image, and inline attributes survive every sanitiser that might sit
       between the repository and a reader. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- window -->
    <rect x="8" y="8" width="944" height="524" rx="14" fill="#1c1c1e" stroke="#3a3a3c"/>

    <!-- sidebar -->
    <path d="M8 22a14 14 0 0 1 14-14h248v524H22A14 14 0 0 1 8 518Z" fill="#242428"/>
    <circle cx="38" cy="34" r="6" fill="#ff5f57"/>
    <circle cx="58" cy="34" r="6" fill="#febc2e"/>
    <circle cx="78" cy="34" r="6" fill="#28c840"/>

    <rect x="28" y="62" width="224" height="32" rx="8" fill="#38383c"/>
    <circle cx="46" cy="78" r="5.5" fill="none" stroke="#98989d" stroke-width="1.6"/>
    <line x1="50" y1="82" x2="54" y2="86" stroke="#98989d" stroke-width="1.6" stroke-linecap="round"/>
    <text x="64" y="83" font-size="15" fill="#c7c7cc">privacy &amp; security</text>

    <rect x="28" y="106" width="224" height="34" rx="8" fill="#0a6cff"/>
    <rect x="38" y="115" width="16" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
    <text x="64" y="128" font-size="15" font-weight="600" fill="#ffffff">Privacy &amp; Security</text>

    <!-- pane -->
    <text x="300" y="46" font-size="21" font-weight="700" fill="#f5f5f7">Privacy &amp; Security</text>
    <text x="300" y="104" font-size="15" font-weight="700" fill="#f5f5f7">Security</text>

    <rect x="300" y="122" width="620" height="52" rx="10" fill="#2c2c2e"/>
    <text x="318" y="154" font-size="15" fill="#f5f5f7">Allow applications from</text>
    <text x="902" y="154" font-size="15" fill="#a1a1a6" text-anchor="end">App Store &amp; Known Developers</text>

    <!-- the row that matters -->
    <rect x="300" y="186" width="620" height="112" rx="10" fill="#2c2c2e"/>
    <text x="318" y="220" font-size="15" fill="#f5f5f7">&#8220;9film.app&#8221; was blocked to protect your Mac.</text>

    <rect x="742" y="200" width="160" height="34" rx="7" fill="#4c4c50" stroke="#5c5c60"/>
    <text x="822" y="222" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Open Anyway</text>

    <line x1="318" y1="250" x2="902" y2="250" stroke="#3a3a3c"/>
    <text x="318" y="272" font-size="13" fill="#98989d">Apple could not verify &#8220;9film.app&#8221; is free of malware that may harm your</text>
    <text x="318" y="290" font-size="13" fill="#98989d">Mac or compromise your privacy.</text>

    <!-- annotation -->
    <rect x="292" y="178" width="636" height="128" rx="13" fill="none" stroke="#ff5f4d" stroke-width="3"/>
    <path d="M822 356 L822 320" stroke="#ff5f4d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M822 310 l-7 13 h14 Z" fill="#ff5f4d"/>
    <text x="822" y="378" font-size="14" font-weight="700" fill="#ff5f4d" text-anchor="middle">Click this, once</text>

    <!-- dimmed rows, so the pane reads as the real list -->
    <rect x="300" y="400" width="620" height="46" rx="10" fill="#2c2c2e" opacity="0.5"/>
    <text x="318" y="428" font-size="15" fill="#f5f5f7" opacity="0.4">FileVault</text>
    <rect x="300" y="454" width="620" height="46" rx="10" fill="#2c2c2e" opacity="0.35"/>
    <text x="318" y="482" font-size="15" fill="#f5f5f7" opacity="0.3">Lockdown Mode</text>
  </g>
</svg>
