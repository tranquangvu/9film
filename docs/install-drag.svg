<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img"
     aria-label="The mounted 9film disk image: the app on the left, an Applications shortcut on the right, drag one onto the other.">
  <title>Installing: drag 9film into Applications</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <rect x="8" y="8" width="744" height="384" rx="14" fill="#1c1c1e" stroke="#3a3a3c"/>
    <path d="M8 22a14 14 0 0 1 14-14h716a14 14 0 0 1 14 14v34H8Z" fill="#2a2a2d"/>
    <circle cx="34" cy="32" r="6" fill="#ff5f57"/>
    <circle cx="54" cy="32" r="6" fill="#febc2e"/>
    <circle cx="74" cy="32" r="6" fill="#28c840"/>
    <text x="380" y="38" font-size="14" font-weight="600" fill="#e5e5ea" text-anchor="middle">9film</text>

    <!-- the app -->
    <rect x="150" y="140" width="120" height="120" rx="27" fill="#f97316"/>
    <rect x="176" y="176" width="68" height="48" rx="6" fill="#1c1c1e" opacity="0.85"/>
    <circle cx="196" cy="200" r="9" fill="#f97316"/>
    <path d="M212 191 l22 9 -22 9 Z" fill="#f97316"/>
    <text x="210" y="292" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">9film</text>

    <!-- applications -->
    <path d="M490 148h44l14 16h68a10 10 0 0 1 10 10v76a10 10 0 0 1-10 10H490a10 10 0 0 1-10-10V158a10 10 0 0 1 10-10Z" fill="#3b82f6"/>
    <path d="M480 176h146v74a10 10 0 0 1-10 10H490a10 10 0 0 1-10-10Z" fill="#60a5fa"/>
    <text x="553" y="292" font-size="15" font-weight="600" fill="#f5f5f7" text-anchor="middle">Applications</text>

    <!-- drag -->
    <path d="M292 200 C 360 158, 400 158, 456 196" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/>
    <path d="M466 202 l-16 -6 3 13 Z" fill="#f97316"/>
    <text x="380" y="140" font-size="15" font-weight="700" fill="#f97316" text-anchor="middle">drag it across</text>

    <text x="380" y="348" font-size="13" fill="#98989d" text-anchor="middle">Install it first: launched straight from the disk image, macOS runs a read-only copy of it.</text>
  </g>
</svg>
