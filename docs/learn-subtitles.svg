<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img"
     aria-label="The player with a subtitle line: one word is highlighted and a popup shows its meaning, translation and a Save button.">
  <title>Click a word in the subtitles to save it</title>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <rect x="8" y="8" width="844" height="464" rx="14" fill="#0a0a0a" stroke="#3a3a3c"/>

    <!-- word popup -->
    <rect x="250" y="120" width="360" height="176" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <text x="274" y="156" font-size="20" font-weight="700" fill="#fafafa">startin&#8217;</text>
    <text x="352" y="156" font-size="14" fill="#71717a">/ˈstɑːtɪŋ/</text>
    <rect x="560" y="136" width="26" height="26" rx="13" fill="#27272a"/>
    <path d="M569 143 v12 M566 149 h6" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <text x="274" y="184" font-size="16" font-weight="600" fill="#fb923c">bắt đầu</text>
    <text x="274" y="212" font-size="13" fill="#a1a1aa">verb — to begin doing or being something.</text>
    <line x1="274" y1="232" x2="586" y2="232" stroke="#27272a"/>
    <text x="274" y="264" font-size="12" fill="#71717a">Kept with its sentence</text>
    <rect x="466" y="242" width="120" height="34" rx="8" fill="#f97316"/>
    <text x="526" y="264" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Save word</text>

    <!-- subtitle line -->
    <text x="430" y="384" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">You got to be</text>
    <rect x="524" y="362" width="112" height="32" rx="6" fill="#f97316" opacity="0.42"/>
    <text x="580" y="384" font-size="24" font-weight="700" fill="#fdba74" text-anchor="middle">startin&#8217;</text>
    <text x="700" y="384" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">somethin&#8217;</text>

    <path d="M580 356 L580 302" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6"/>
    <path d="M580 296 l-7 13 h14 Z" fill="#f97316"/>

    <text x="430" y="428" font-size="13" fill="#a1a1aa" text-anchor="middle">Hover the line and the film pauses. Click a word — or drag across several to keep a whole phrase.</text>

    <!-- player controls, hinted -->
    <rect x="150" y="448" width="560" height="6" rx="3" fill="#27272a"/>
    <rect x="150" y="448" width="210" height="6" rx="3" fill="#f97316"/>
  </g>
</svg>
