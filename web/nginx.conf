# The whole app on one origin: nginx serves the built SPA and forwards /api and
# /hls to the Go backend. Same origin means the browser never issues a
# cross-origin request, so middleware.CORS's allow-list never has to know about
# whatever host this is deployed under.

# Docker's embedded DNS, re-resolved every 10s. proxy_pass through a variable
# (below) is what forces that re-resolution — a literal upstream name is
# resolved once at startup, so restarting the api container would leave nginx
# proxying to a dead IP until reloaded.
resolver 127.0.0.11 ipv6=off valid=10s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Word imports are the only sizeable request body.
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  location /api/ {
    set $api http://api:8081;
    # $request_uri and not $uri: a variable proxy_pass drops the original URI,
    # and /api/stream and /hls both live off their query string.
    proxy_pass $api$request_uri;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_read_timeout 60s;
  }

  location = /hls {
    set $api http://api:8081;
    proxy_pass $api$request_uri;
    include /etc/nginx/conf.d/proxy.inc;

    # Manifests are rewritten per request and segments are large: buffering
    # would add latency to every seek and spool .ts files to disk for nothing.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Vite emits content-hashed filenames, so these can never go stale.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The shell must be re-fetched or a deploy leaves clients on the old bundle.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Client-side routing: /title/tt123, /watch/tt123 and friends are not files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
