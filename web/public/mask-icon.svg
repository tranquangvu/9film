<!-- Safari's pinned-tab icon: the glyph alone, one flat colour, cropped to its
     own bounds. Safari throws the colour away and keeps the silhouette, so the
     black rounded square the other icons sit on would come out as a solid
     block — hence this stripped copy of desktop/build/appicon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="291 258 442 508">
  <g transform="translate(512,512) scale(1.7) translate(-256,-259)">
    <path fill="#000000" fill-rule="evenodd"
          d="M256,110 A130,130 0 0 1 386,240 L386,371 A37,37 0 0 1 312,371 L312,357.3 A130,130 0 1 1 256,110 Z
             M200,240 a56,56 0 1,0 112,0 a56,56 0 1,0 -112,0 Z"/>
    <polygon points="236,212 236,268 286,240" fill="#000000" stroke="#000000" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
